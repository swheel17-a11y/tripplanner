<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trip Planner</title>
  <meta name="description" content="Work backward from a deadline to know exactly when to leave.">
  <meta name="theme-color" content="#1a56db">
  <!-- Home-screen install (Android uses the manifest, iPhone uses the apple-* tags) -->
  <script>
    // iPhone opened from a setup link: leave out the manifest, so "Add to Home Screen" saves
    // this exact link (with the setup code) instead of the plain start page.
    if (!(/iPhone|iPad|iPod/.test(navigator.userAgent) && location.hash.includes('setup=') && !navigator.standalone)) {
      const m = document.createElement('link');
      m.rel = 'manifest';
      m.href = 'manifest.json';
      document.head.append(m);
    }
  </script>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Trip Planner">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Trip Planner</h1>
  </header>
  <main></main>
  <nav>
    <button data-view="plan">🗺️<span>Plan</span></button>
    <button data-view="result">⏰<span>Leave</span></button>
    <button data-view="saved">⭐<span>Saved</span></button>
    <button data-view="settings">⚙️<span>Settings</span></button>
  </nav>
  <script type="module" src="app.js"></script>
</body>
</html>
